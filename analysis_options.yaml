# analysis_options.yaml
# Configuration complète pour Flutter avec les meilleures règles de lint
# Ce fichier doit être placé à la racine de votre projet Flutter

include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclure les fichiers générés et les dossiers de build
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"
    - "**/generated/**"
    - "lib/generated/**"
    - "build/**"
    - ".dart_tool/**"
    - "ios/**"
    - "android/**"
    - "windows/**"
    - "macos/**"
    - "linux/**"
    - "web/**"

  # Erreurs à traiter strictement
  errors:
    # Traiter les TODOs comme des infos (pas des erreurs)
    todo: info
    # Traiter les FIXMEs comme des warnings
    fixme: warning

    # Null safety stricte
    invalid_null_aware_operator: error
    unnecessary_null_comparison: error

    # Imports et dépendances
    depend_on_referenced_packages: error
    sort_pub_dependencies: ignore

    # Performance
    avoid_slow_async_io: error

    # Style et lisibilité
    directives_ordering: error
    always_declare_return_types: error
    # always_use_package_imports: error
    avoid_empty_else: error
    avoid_print: warning
    avoid_relative_lib_imports: error
    avoid_returning_null_for_future: error
    avoid_types_as_parameter_names: error
    avoid_web_libraries_in_flutter: error
    cancel_subscriptions: error
    close_sinks: error
    no_duplicate_case_values: error
    prefer_relative_imports: ignore
    use_key_in_widget_constructors: warning
    flutter_style_todos: ignore
    always_put_control_body_on_new_line: ignore

  # Configuration du langage
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # STYLE - Conventions de code
    - camel_case_types
    - camel_case_extensions
    - library_names
    - file_names
    - library_prefixes
    - non_constant_identifier_names
    - constant_identifier_names # Parfois désactivé selon préférences
    - directives_ordering
    - lines_longer_than_80_chars # Désactiver si vous préférez des lignes plus longues

    # DOCUMENTATION
    # - package_api_docs # Désactiver si pas de package public
    # - public_member_api_docs # Désactiver pour projets internes
    - comment_references
    - slash_for_doc_comments

    # USAGE - Bonnes pratiques générales
    - implementation_imports
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    # - avoid_returning_null_for_future
    - avoid_slow_async_io
    - avoid_types_as_parameter_names
    # - avoid_web_libraries_in_flutter
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    # - invariant_booleans
    # - iterable_contains_unrelated_type
    # - list_remove_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - prefer_void_to_null
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps

    # DESIGN - Architecture et structure
    - use_to_and_as_if_applicable
    #    - one_member_abstracts
    #    - avoid_classes_with_only_static_members
    - prefer_mixin
    - use_setters_to_change_properties
    - avoid_setters_without_getters
    # - avoid_returning_null
    - avoid_returning_this
    - type_init_formals
    - avoid_init_to_null
    - unnecessary_getters_setters
    - unnecessary_this
    #    - prefer_expression_function_bodies # Désactiver si préférence pour les blocs
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals

    # ERRORS - Prévention d'erreurs
    - always_declare_return_types
    - avoid_catching_errors
    - avoid_type_to_string
    - no_logic_in_create_state
    - prefer_typing_uninitialized_variables
    - use_build_context_synchronously
    - use_key_in_widget_constructors

    # NULL SAFETY
    # - avoid_null_checks_in_equality_operators
    - unnecessary_null_aware_assignments
    - unnecessary_null_checks
    - unnecessary_null_in_if_null_operators
    - unnecessary_nullable_for_final_variable_declarations

    # PERFORMANCE
    - avoid_function_literals_in_foreach_calls
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace
    - use_full_hex_values_for_flutter_colors

    # COLLECTIONS
    # - avoid_function_literals_in_foreach_calls
    - prefer_collection_literals
    - prefer_contains
    - prefer_for_elements_to_map_fromIterable
    - prefer_if_elements_to_conditional_expressions
    - prefer_inlined_adds
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_is_not_operator
    - prefer_iterable_whereType
    - prefer_spread_collections

    # ASYNC
    # - avoid_returning_null_for_future
    # - cancel_subscriptions
    - unawaited_futures
    # - prefer_async_await

    # STRINGS
    - prefer_adjacent_string_concatenation
    - prefer_interpolation_to_compose_strings
    - unnecessary_string_interpolations
    - use_string_buffers

    # FUNCTIONS
    #    - avoid_positional_boolean_parameters
    - avoid_redundant_argument_values
    - avoid_renaming_method_parameters
    - avoid_unused_constructor_parameters
    - prefer_function_declarations_over_variables
    - unnecessary_lambdas

    # EQUALITY & COMPARISON
    - avoid_bool_literals_in_conditional_expressions
    - avoid_implementing_value_types
    - use_late_for_private_fields_and_variables

    # CONSTRUCTORS
    - avoid_unnecessary_containers
    - prefer_constructors_over_static_methods
    - sort_constructors_first
    - sort_unnamed_constructors_first

    # IMPORTS
    # - always_use_package_imports
    # - avoid_web_libraries_in_flutter
    - depend_on_referenced_packages
    - package_names
    - secure_pubspec_urls

    # PARAMETERS
    - always_put_required_named_parameters_first
    # - avoid_positional_boolean_parameters
    # - always_require_non_null_named_parameters

    # TYPES
    - avoid_annotating_with_dynamic
    - avoid_dynamic_calls
    - avoid_types_on_closure_parameters
    - omit_local_variable_types
    - prefer_generic_function_type_aliases
    - type_annotate_public_apis

    # FLUTTER SPECIFIC
    - use_colored_box
    - use_decorated_box
    # - use_full_hex_values_for_flutter_colors
    # - use_key_in_widget_constructors
    - sized_box_shrink_expand
    - sort_child_properties_last
    # - avoid_unnecessary_containers
    # - avoid_web_libraries_in_flutter
    # - no_logic_in_create_state
    # - prefer_const_constructors
    # - prefer_const_constructors_in_immutables
    # - prefer_const_declarations
    # - prefer_const_literals_to_create_immutables
    # - use_build_context_synchronously

    # AUTRES BONNES PRATIQUES
    - always_put_control_body_on_new_line
    - avoid_field_initializers_in_const_classes
    - avoid_final_parameters
    - avoid_multiple_declarations_per_line
    # - avoid_redundant_argument_values
    - avoid_void_async
    - cascade_invocations
    - cast_nullable_to_non_nullable
    - conditional_uri_does_not_exist
    - deprecated_consistency
    - do_not_use_environment
    - eol_at_end_of_file
    - exhaustive_cases
    - flutter_style_todos
    - join_return_with_assignment
    - leading_newlines_in_multiline_strings
    - missing_whitespace_between_adjacent_strings
    - no_runtimeType_toString
    - noop_primitive_operations
    - null_check_on_nullable_type_parameter
    - parameter_assignments
    - prefer_asserts_in_initializer_lists
    - prefer_if_null_operators
    - prefer_null_aware_method_calls
    #    - prefer_single_quotes
    - require_trailing_commas
    - tighten_type_of_initializing_formals
    # - unnecessary_await_in_return
    - unnecessary_constructor_name
    - unnecessary_late
    - unnecessary_library_directive
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - unnecessary_string_escapes
    - use_enums
    # - use_if_null_to_convert_nulls_to_bools
    - use_is_even_rather_than_modulo
    - use_named_constants
    - use_raw_strings
    - use_string_in_part_of_directives
    - use_super_parameters

    # RÈGLES À CONSIDÉRER MAIS SOUVENT DÉSACTIVÉES
    # Décommenter selon vos besoins

    # - avoid_catches_without_on_clauses # Peut être trop strict
    # - avoid_equals_and_hash_code_on_mutable_classes # Bon pour immutabilité
    # - diagnostic_describe_all_properties # Pour debugging avancé
    - prefer_double_quotes # Si vous préférez les doubles quotes
    # - sort_constructors_first # Si vous voulez forcer l'ordre
    # - unnecessary_final # Si vous ne voulez pas forcer final partout
    # - prefer_single_quotes # Activé par défaut ci-dessus
    # - require_trailing_commas # Activé par défaut ci-dessus

# Configuration pour dart_code_metrics (si utilisé)
dart_code_metrics:
  metrics:
    cyclomatic-complexity: 20
    maximum-nesting-level: 5
    number-of-parameters: 5
    source-lines-of-code: 50

  metrics-exclude:
    - test/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  rules:
    # Anti-patterns
    - avoid-dynamic
    - avoid-ignoring-return-values
    - avoid-missing-enum-constant-in-map
    - avoid-nested-conditional-expressions:
        acceptable-level: 2
    - avoid-throw-in-catch-block
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unused-parameters
    - binary-expression-operand-order
    - double-literal-format
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block
    - no-equal-then-else
    - no-magic-number:
        allowed: [0, 1, -1, 2, 100]
    - no-object-declaration
    - prefer-async-await
    - prefer-conditional-expressions
    - prefer-correct-identifier-length:
        exceptions: ["id", "i", "j", "k", "x", "y", "z", "e"]
        max-identifier-length: 30
        min-identifier-length: 2
    - prefer-correct-type-name:
        max-length: 40
        min-length: 3
    - prefer-enums-by-name
    - prefer-first
    - prefer-immediate-return
    - prefer-iterable-of
    - prefer-last
    - prefer-match-file-name
    - prefer-moving-to-variable
    - prefer-trailing-comma

    # Flutter specific
    - always-remove-listener
    - avoid-border-all
    - avoid-returning-widgets
    - avoid-shrink-wrap-in-lists
    - avoid-unnecessary-setstate
    - avoid-wrapping-in-padding
    - check-for-equals-in-render-object-setters
    - consistent-update-render-object
    - prefer-const-border-radius
    - prefer-correct-edge-insets-constructor
    - prefer-extracting-callbacks
    - prefer-single-widget-per-file:
        ignore-private-widgets: true
    - prefer-using-list-view
    - use-setstate-synchronously
