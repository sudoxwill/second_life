name: second_life
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  camera: ^0.12.1
  cloud_firestore: ^6.10.0
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  google_sign_in: ^6.2.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.20
  mime: ^2.1.0
  mobile_scanner: ^7.4.2
  mocktail: ^1.0.5
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/logos/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700

    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600

    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
          weight: 400
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700

flutter_intl:
  enabled: false

## flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#fefefe"
  color_dark: "#1C1B1F"
  image: assets/images/logos/logo.png
